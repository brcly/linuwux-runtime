name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
      - name: Component lint configurations
        run: |
          for profile in dev release; do
            for features in '' cpuid hooks reflex syscall kuser faketime gamescope debug environment cpuid,hooks,reflex,syscall cpuid,hooks,reflex,syscall,kuser cpuid,hooks,reflex,syscall,kuser,faketime,gamescope; do
              cargo clippy -p linuwux-runtime --lib --profile "$profile" --no-default-features --features "$features" -- -D warnings
            done
          done
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri test -p linuwux-runtime --lib
      - run: cargo +nightly miri test -p linuwux-rust
